name: Private Payment CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: FAZER CHECKOUT DO REPOSITÓRIO
        uses: actions/checkout@v4

      - name: DEFINIR VERSÃO DO NODE.JS
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"
          cache: "npm"

      - name: INSTALAR DEPENDÊNCIAS
        run: npm ci

      - name: INICIAR A API
        run: |
          nohup npm start > /tmp/payment-control.log 2>&1 &
          for i in {1..30}; do
            if curl -s http://127.0.0.1:4000/graphql >/dev/null 2>&1; then
              echo "API pronta"
              exit 0
            fi
            sleep 1
          done
          echo "API não subiu"
          cat /tmp/payment-control.log
          exit 1

      - name: EXECUTAR OS TESTES
        run: npm test